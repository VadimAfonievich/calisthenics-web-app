services:
  - type: web
    name: calisthenics-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: calisthenics-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: calisthenics-key-value
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBAPP_URL
        value: https://calisthenics-web.onrender.com
      - key: CORS_ORIGINS
        value: https://calisthenics-web.onrender.com
      - key: LOG_LEVEL
        value: INFO
      - key: OBJECT_STORAGE_PROVIDER
        value: unavailable
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: OBJECT_STORAGE_PUBLIC_URL
        sync: false

  - type: web
    name: calisthenics-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://calisthenics-api-r57c.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: calisthenics-key-value
    region: frankfurt
    plan: free
    ipAllowList: []

databases:
  - name: calisthenics-db
    databaseName: calisthenics
    user: calisthenics
    region: frankfurt
    plan: free
    ipAllowList: []
